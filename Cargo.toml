[package]
name = "imdev"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
description = "Native Rust HTTP API workspace"
license = "MIT"
publish = false

[features]
default = ["native-app"]
native-app = []

[[bin]]
name = "imdev"
path = "src/main.rs"
required-features = ["native-app"]

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
ring = "=0.17.14"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
strip = true
